name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests, build, browser tests
    runs-on: ubuntu-latest
    # Postgres for the visitor log: unit tests and the admin panel's browser tests run against it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zaproom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zaproom
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zaproom
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          SITE_URL: http://localhost:3100
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-site
          path: test-results
          retention-days: 7

  calls:
    name: Real calls against LiveKit
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - name: Start LiveKit (dev mode)
        run: |
          docker run -d --name livekit -p 7880:7880 -p 7881:7881 -p 7882:7882/udp \
            livekit/livekit-server:latest --dev --bind 0.0.0.0 --node-ip 127.0.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for LiveKit
        run: timeout 30 bash -c 'until curl -sf http://localhost:7880 >/dev/null; do sleep 1; done'
      - run: pnpm e2e:call
      - name: Fresh LiveKit for screenshots (no rooms left over from the tests)
        run: |
          docker restart livekit
          timeout 30 bash -c 'until curl -sf http://localhost:7880 >/dev/null; do sleep 1; done'
      - name: README screenshots
        run: LIVEKIT_E2E=1 SCREENSHOTS=1 pnpm exec playwright test tests/e2e/screenshots.spec.ts --retries=0
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/screens
          retention-days: 14
      - if: failure()
        run: docker logs livekit | tail -100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-calls
          path: test-results
          retention-days: 7
